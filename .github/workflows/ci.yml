name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: impeccable detect (UI anti-patterns)
        run: npx -y impeccable@4.10.0 detect --github packages/ui/app/src
      # Needs `pnpm build` above: the demo serves packages/ui/dist/app.
      - name: impeccable detect (rendered page, static demo)
        run: |
          node packages/ui/scripts/demo.ts --static --port 4848 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4848/api/status >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4848/api/status >/dev/null || { echo "demo did not start"; exit 1; }
          npx -y impeccable@4.10.0 detect --github http://127.0.0.1:4848/
          npx -y impeccable@4.10.0 detect --github --viewport 390x844 http://127.0.0.1:4848/

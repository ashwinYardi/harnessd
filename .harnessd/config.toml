# harnessd builds harnessd (MET-20). Secrets stay in the environment, never here.
[linear]
team_id = "MET"
project = "harnessd"

[limits]
max_concurrent = 2

# Models per agent. Effort per harness is MET-89; until then Codex runs at the model's
# default effort and Claude at its default.
[agents.coordinator]
role = "coordinator"
harness = "claude-code"
model = "claude-opus-5-5"

[agents.backend]
role = "backend"
harness = "codex"
model = "gpt-6.2-sol"

[agents.frontend]
role = "frontend"
harness = "claude-code"
model = "claude-opus-5-5"

[agents.qa]
role = "qa"
harness = "codex"
model = "gpt-6.2-sol"

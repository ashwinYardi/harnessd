# harnessd builds harnessd (MET-20). Secrets stay in the environment, never here.
[linear]
team_id = "MET"
project = "harnessd"

[limits]
# Owner 2026-11-22: one ticket at a time (one PR, one QA, merge, next).
max_concurrent = 1

# QA runs harnessd itself (MET-181, D-051). A frontend part gets the demo app with synthetic
# data; a backend part gets a sandbox daemon that stays in setup (D-026).
[qa]
kind = "web"
build = "pnpm build"
start = "scripts/qa/start.sh"
url = "http://127.0.0.1:{port}"
health = "/api/status"
seed = "scripts/qa/seed.sh"
env = []

# Models per agent. Effort per harness is MET-89; until then Codex runs at the model's
# default effort and Claude at its default.
[agents.coordinator]
role = "coordinator"
harness = "claude-code"
model = "claude-opus-5-5"

[agents.backend]
role = "backend"
harness = "opencode"
model = "opencode-go/deepseek-v4.1-flash#high"
# Owner 2026-11-22: only the coordinator on Claude; the rest on OpenCode. Codex only as a fallback on a limit.
fallback_harness = "codex"
fallback_model = "gpt-6.2-sol"

[agents.frontend]
role = "frontend"
harness = "opencode"
model = "opencode-go/glm-5.3-flash"
# Owner 2026-11-22: only the coordinator on Claude; the rest on OpenCode. Codex only as a fallback on a limit.
fallback_harness = "codex"
fallback_model = "gpt-6.2-sol"

[agents.qa]
role = "qa"
# Owner 2026-11-24: QA runs on Codex first. On OpenCode, QA hit the 30 min limit twice
# (100 to 150 s per turn); Codex finished the same QA in about 2 min. OpenCode is the fallback.
harness = "codex"
model = "gpt-6.2-sol"
fallback_harness = "opencode"
fallback_model = "opencode-go/deepseek-v4.1-flash#high"
